<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 60">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8A98B"/>
      <stop offset="50%" style="stop-color:#C9A9A6"/>
      <stop offset="100%" style="stop-color:#B8A98B"/>
    </linearGradient>
  </defs>
  
  <!-- Central design -->
  <circle cx="75" cy="30" r="20" fill="none" stroke="url(#footerGrad)" stroke-width="2"/>
  <circle cx="75" cy="30" r="12" fill="none" stroke="url(#footerGrad)" stroke-width="1.5"/>
  <circle cx="75" cy="30" r="5" fill="#C9A9A6" opacity="0.5"/>
  
  <!-- Left swirl -->
  <path d="M 75 30 Q 50 20, 25 30 Q 15 35, 20 40" stroke="url(#footerGrad)" stroke-width="2" fill="none"/>
  <circle cx="30" cy="32" r="3" fill="#B8A98B" opacity="0.6"/>
  
  <!-- Right swirl -->
  <path d="M 75 30 Q 100 20, 125 30 Q 135 35, 130 40" stroke="url(#footerGrad)" stroke-width="2" fill="none"/>
  <circle cx="120" cy="32" r="3" fill="#B8A98B" opacity="0.6"/>
</svg>
