<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="closingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6B7B5F"/>
      <stop offset="50%" style="stop-color:#9CAF88"/>
      <stop offset="100%" style="stop-color:#6B7B5F"/>
    </linearGradient>
  </defs>
  
  <!-- Central ornament -->
  <circle cx="100" cy="50" r="30" fill="none" stroke="#B8A98B" stroke-width="2"/>
  <circle cx="100" cy="50" r="20" fill="none" stroke="#C9A9A6" stroke-width="1.5"/>
  <circle cx="100" cy="50" r="8" fill="#C9A9A6" opacity="0.5"/>
  
  <!-- Left vine -->
  <path d="M 100 50 Q 60 40, 30 50" stroke="url(#closingGrad)" stroke-width="2" fill="none"/>
  <ellipse cx="60" cy="45" rx="12" ry="6" fill="#8A9B7C" opacity="0.7" transform="rotate(-30 60 45)"/>
  <ellipse cx="45" cy="48" rx="10" ry="5" fill="#9CAF88" opacity="0.6" transform="rotate(-25 45 48)"/>
  <circle cx="50" cy="52" r="4" fill="#C9A9A6" opacity="0.6"/>
  
  <!-- Right vine (mirror) -->
  <path d="M 100 50 Q 140 40, 170 50" stroke="url(#closingGrad)" stroke-width="2" fill="none"/>
  <ellipse cx="140" cy="45" rx="12" ry="6" fill="#8A9B7C" opacity="0.7" transform="rotate(30 140 45)"/>
  <ellipse cx="155" cy="48" rx="10" ry="5" fill="#9CAF88" opacity="0.6" transform="rotate(25 155 48)"/>
  <circle cx="150" cy="52" r="4" fill="#C9A9A6" opacity="0.6"/>
</svg>
