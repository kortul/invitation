<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 400">
  <defs>
    <linearGradient id="leafGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6B7B5F"/>
      <stop offset="50%" style="stop-color:#8A9B7C"/>
      <stop offset="100%" style="stop-color:#6B7B5F"/>
    </linearGradient>
  </defs>
  
  <!-- Main vine (mirrored) -->
  <path d="M 20 50 Q 40 100, 30 150 Q 20 200, 40 250 Q 60 300, 30 350" stroke="url(#leafGrad4)" stroke-width="3" fill="none"/>
  
  <!-- Side branches -->
  <path d="M 30 100 Q 50 110, 60 100" stroke="url(#leafGrad4)" stroke-width="2" fill="none"/>
  <path d="M 40 200 Q 60 210, 70 200" stroke="url(#leafGrad4)" stroke-width="2" fill="none"/>
  <path d="M 40 300 Q 60 310, 65 300" stroke="url(#leafGrad4)" stroke-width="2" fill="none"/>
  
  <!-- Leaves -->
  <ellipse cx="50" cy="110" rx="12" ry="6" fill="#8A9B7C" opacity="0.8" transform="rotate(45 50 110)"/>
  <ellipse cx="60" cy="210" rx="14" ry="7" fill="#9CAF88" opacity="0.7" transform="rotate(40 60 210)"/>
  <ellipse cx="65" cy="300" rx="11" ry="5" fill="#8A9B7C" opacity="0.8" transform="rotate(50 65 300)"/>
  
  <!-- Flowers -->
  <circle cx="35" cy="150" r="5" fill="#C9A9A6" opacity="0.7"/>
  <circle cx="45" cy="250" r="4" fill="#C9A9A6" opacity="0.6"/>
  <circle cx="30" cy="350" r="5" fill="#C9A9A6" opacity="0.7"/>
</svg>
