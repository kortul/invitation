<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Placeholder Mansion/Chateau -->
  <defs>
    <style>
      .mansion-line { stroke: #2c2c2c; fill: none; stroke-width: 2; }
      .mansion-fill { fill: #e8e3d8; stroke: #2c2c2c; stroke-width: 1.5; }
    </style>
  </defs>
  
  <!-- Main structure -->
  <rect class="mansion-fill" x="50" y="150" width="400" height="200" />
  
  <!-- Left wing -->
  <rect class="mansion-fill" x="20" y="180" width="50" height="170" />
  <circle cx="45" cy="200" r="8" fill="#9d9c7f" />
  
  <!-- Right wing -->
  <rect class="mansion-fill" x="430" y="180" width="50" height="170" />
  <circle cx="455" cy="200" r="8" fill="#9d9c7f" />
  
  <!-- Central tower -->
  <rect class="mansion-fill" x="200" y="80" width="100" height="150" />
  <polygon class="mansion-fill" points="200,80 250,30 300,80" />
  <circle cx="250" cy="50" r="6" fill="#9d9c7f" />
  
  <!-- Windows - main building -->
  <circle cx="100" cy="200" r="12" fill="#b8a8a0" />
  <circle cx="150" cy="200" r="12" fill="#b8a8a0" />
  <circle cx="250" cy="200" r="12" fill="#b8a8a0" />
  <circle cx="300" cy="200" r="12" fill="#b8a8a0" />
  <circle cx="350" cy="200" r="12" fill="#b8a8a0" />
  <circle cx="400" cy="200" r="12" fill="#b8a8a0" />
  
  <!-- Windows - upper level -->
  <circle cx="120" cy="280" r="10" fill="#b8a8a0" />
  <circle cx="200" cy="280" r="10" fill="#b8a8a0" />
  <circle cx="250" cy="280" r="10" fill="#b8a8a0" />
  <circle cx="300" cy="280" r="10" fill="#b8a8a0" />
  <circle cx="380" cy="280" r="10" fill="#b8a8a0" />
  
  <!-- Door -->
  <rect class="mansion-fill" x="235" y="300" width="30" height="50" />
  <circle cx="260" cy="325" r="2" fill="#9d9c7f" />
  
  <!-- Decorative elements -->
  <line class="mansion-line" x1="50" y1="150" x2="450" y2="150" />
  <line class="mansion-line" x1="50" y1="250" x2="450" y2="250" />
  
  <!-- Ornamental details -->
  <path class="mansion-line" d="M 60 130 Q 70 110 80 130" />
  <path class="mansion-line" d="M 420 130 Q 430 110 440 130" />
  <path class="mansion-line" d="M 240 60 Q 250 45 260 60" />
</svg>