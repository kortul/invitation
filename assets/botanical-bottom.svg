<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100">
  <defs>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6B7B5F"/>
      <stop offset="50%" style="stop-color:#8A9B7C"/>
      <stop offset="100%" style="stop-color:#6B7B5F"/>
    </linearGradient>
  </defs>
  
  <!-- Left vine (inverted) -->
  <path d="M 50 20 Q 100 40, 150 30 Q 200 20, 250 40" stroke="url(#leafGrad2)" stroke-width="3" fill="none"/>
  <path d="M 100 30 Q 110 50, 130 45" stroke="url(#leafGrad2)" stroke-width="2" fill="none"/>
  <path d="M 180 35 Q 190 55, 210 50" stroke="url(#leafGrad2)" stroke-width="2" fill="none"/>
  
  <!-- Leaves left -->
  <ellipse cx="100" cy="30" rx="15" ry="8" fill="#8A9B7C" opacity="0.8" transform="rotate(30 100 30)"/>
  <ellipse cx="130" cy="45" rx="12" ry="6" fill="#9CAF88" opacity="0.7" transform="rotate(-20 130 45)"/>
  <ellipse cx="180" cy="35" rx="14" ry="7" fill="#8A9B7C" opacity="0.8" transform="rotate(25 180 35)"/>
  <ellipse cx="210" cy="50" rx="11" ry="5" fill="#9CAF88" opacity="0.7" transform="rotate(-15 210 50)"/>
  
  <!-- Center ornament -->
  <circle cx="300" cy="50" r="25" fill="none" stroke="#B8A98B" stroke-width="2"/>
  <circle cx="300" cy="50" r="15" fill="none" stroke="#C9A9A6" stroke-width="1.5"/>
  <circle cx="300" cy="50" r="5" fill="#C9A9A6" opacity="0.6"/>
  
  <!-- Right vine (mirror inverted) -->
  <path d="M 350 40 Q 400 20, 450 30 Q 500 40, 550 20" stroke="url(#leafGrad2)" stroke-width="3" fill="none"/>
  <path d="M 390 35 Q 400 55, 420 50" stroke="url(#leafGrad2)" stroke-width="2" fill="none"/>
  <path d="M 470 30 Q 480 50, 500 45" stroke="url(#leafGrad2)" stroke-width="2" fill="none"/>
  
  <!-- Leaves right -->
  <ellipse cx="390" cy="35" rx="14" ry="7" fill="#8A9B7C" opacity="0.8" transform="rotate(-25 390 35)"/>
  <ellipse cx="420" cy="50" rx="11" ry="5" fill="#9CAF88" opacity="0.7" transform="rotate(15 420 50)"/>
  <ellipse cx="470" cy="30" rx="15" ry="8" fill="#8A9B7C" opacity="0.8" transform="rotate(-30 470 30)"/>
  <ellipse cx="500" cy="45" rx="12" ry="6" fill="#9CAF88" opacity="0.7" transform="rotate(20 500 45)"/>
  
  <!-- Small flowers -->
  <circle cx="120" cy="35" r="4" fill="#C9A9A6" opacity="0.7"/>
  <circle cx="200" cy="42" r="3" fill="#C9A9A6" opacity="0.6"/>
  <circle cx="400" cy="42" r="3" fill="#C9A9A6" opacity="0.6"/>
  <circle cx="480" cy="35" r="4" fill="#C9A9A6" opacity="0.7"/>
</svg>
