<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5EFE6"/>
      <stop offset="100%" style="stop-color:#E8D5C5"/>
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="300" height="200" fill="url(#skyGrad)" opacity="0.3"/>
  
  <!-- Ground -->
  <ellipse cx="150" cy="180" rx="120" ry="30" fill="#B8C9A6" opacity="0.5"/>
  
  <!-- Trees -->
  <g transform="translate(40, 80)">
    <rect x="15" y="60" width="10" height="40" fill="#8B7355"/>
    <circle cx="20" cy="50" r="25" fill="#8A9B7C" opacity="0.8"/>
    <circle cx="10" cy="55" r="18" fill="#9CAF88" opacity="0.7"/>
    <circle cx="30" cy="55" r="18" fill="#6B7B5F" opacity="0.7"/>
  </g>
  
  <g transform="translate(220, 70)">
    <rect x="15" y="70" width="10" height="50" fill="#8B7355"/>
    <circle cx="20" cy="60" r="30" fill="#8A9B7C" opacity="0.8"/>
    <circle cx="5" cy="65" r="20" fill="#9CAF88" opacity="0.7"/>
    <circle cx="35" cy="65" r="20" fill="#6B7B5F" opacity="0.7"/>
  </g>
  
  <!-- Flowers -->
  <circle cx="80" cy="160" r="5" fill="#C9A9A6" opacity="0.7"/>
  <circle cx="100" cy="170" r="4" fill="#C9A9A6" opacity="0.6"/>
  <circle cx="180" cy="165" r="5" fill="#C9A9A6" opacity="0.7"/>
  <circle cx="200" cy="175" r="4" fill="#C9A9A6" opacity="0.6"/>
  <circle cx="140" cy="168" r="4" fill="#B8A98B" opacity="0.6"/>
  
  <!-- Decorative vines -->
  <path d="M 60 140 Q 80 130, 100 140 Q 120 150, 140 140" stroke="#8A9B7C" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 160 145 Q 180 135, 200 145 Q 220 155, 240 145" stroke="#9CAF88" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
