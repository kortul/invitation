<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">
  <defs>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF8F3"/>
      <stop offset="100%" style="stop-color:#F5EFE6"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A4A4A"/>
      <stop offset="100%" style="stop-color:#2C2C2C"/>
    </linearGradient>
  </defs>
  
  <!-- Groom -->
  <g transform="translate(40, 50)">
    <!-- Body -->
    <ellipse cx="40" cy="140" rx="35" ry="50" fill="url(#suitGrad)"/>
    <!-- Head -->
    <circle cx="40" cy="60" r="25" fill="#E8D5C5"/>
    <!-- Hair -->
    <path d="M 15 50 Q 20 30, 40 25 Q 60 30, 65 50 Q 65 55, 60 55 Q 40 50, 20 55 Q 15 55, 15 50" fill="#3C3C3C"/>
    <!-- Face details -->
    <circle cx="35" cy="58" r="2" fill="#2C2C2C"/>
    <circle cx="45" cy="58" r="2" fill="#2C2C2C"/>
    <path d="M 35 70 Q 40 73, 45 70" stroke="#C9A9A6" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Bride -->
  <g transform="translate(100, 50)">
    <!-- Dress -->
    <ellipse cx="40" cy="145" rx="40" ry="55" fill="url(#dressGrad)" stroke="#E8D5C5" stroke-width="2"/>
    <!-- Head -->
    <circle cx="40" cy="60" r="25" fill="#F5E6D8"/>
    <!-- Hair -->
    <path d="M 15 55 Q 10 40, 20 30 Q 40 20, 60 30 Q 70 40, 65 55 Q 65 60, 60 60 Q 40 55, 20 60 Q 15 60, 15 55" fill="#D4A574"/>
    <!-- Veil -->
    <path d="M 20 35 Q 10 50, 15 80 Q 20 100, 25 100" stroke="#FDF8F3" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M 60 35 Q 70 50, 65 80 Q 60 100, 55 100" stroke="#FDF8F3" stroke-width="3" fill="none" opacity="0.6"/>
    <!-- Face details -->
    <circle cx="35" cy="58" r="2" fill="#2C2C2C"/>
    <circle cx="45" cy="58" r="2" fill="#2C2C2C"/>
    <path d="M 35 70 Q 40 73, 45 70" stroke="#C9A9A6" stroke-width="1.5" fill="none"/>
    <!-- Blush -->
    <ellipse cx="32" cy="65" rx="4" ry="2" fill="#C9A9A6" opacity="0.4"/>
    <ellipse cx="48" cy="65" rx="4" ry="2" fill="#C9A9A6" opacity="0.4"/>
  </g>
  
  <!-- Holding hands -->
  <path d="M 75 130 Q 90 135, 105 130" stroke="#E8D5C5" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Decorative hearts -->
  <path d="M 90 20 Q 95 15, 100 20 Q 105 25, 100 30 Q 95 25, 90 20" fill="#C9A9A6" opacity="0.6"/>
  <path d="M 75 30 Q 78 27, 81 30 Q 84 33, 81 36 Q 78 33, 75 30" fill="#C9A9A6" opacity="0.4"/>
  <path d="M 105 30 Q 108 27, 111 30 Q 114 33, 111 36 Q 108 33, 105 30" fill="#C9A9A6" opacity="0.4"/>
</svg>
