<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="flowerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F5EFE6"/>
      <stop offset="100%" style="stop-color:#C9A9A6"/>
    </radialGradient>
  </defs>
  
  <!-- Main flower -->
  <circle cx="60" cy="60" r="25" fill="url(#flowerGrad)" opacity="0.8"/>
  <circle cx="60" cy="60" r="15" fill="#E8D5C5" opacity="0.7"/>
  <circle cx="60" cy="60" r="8" fill="#C9A9A6" opacity="0.6"/>
  <circle cx="60" cy="60" r="4" fill="#B8A98B"/>
  
  <!-- Petals -->
  <ellipse cx="60" cy="35" rx="8" ry="15" fill="url(#flowerGrad)" opacity="0.7"/>
  <ellipse cx="60" cy="85" rx="8" ry="15" fill="url(#flowerGrad)" opacity="0.7"/>
  <ellipse cx="35" cy="60" rx="15" ry="8" fill="url(#flowerGrad)" opacity="0.7"/>
  <ellipse cx="85" cy="60" rx="15" ry="8" fill="url(#flowerGrad)" opacity="0.7"/>
  
  <!-- Leaves -->
  <ellipse cx="40" cy="40" rx="12" ry="6" fill="#8A9B7C" opacity="0.6" transform="rotate(-45 40 40)"/>
  <ellipse cx="80" cy="80" rx="12" ry="6" fill="#9CAF88" opacity="0.6" transform="rotate(-45 80 80)"/>
  
  <!-- Small buds -->
  <circle cx="30" cy="30" r="5" fill="#C9A9A6" opacity="0.5"/>
  <circle cx="90" cy="90" r="5" fill="#C9A9A6" opacity="0.5"/>
</svg>
