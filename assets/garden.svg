<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Garden Illustration -->
  <defs>
    <style>
      .garden-leaf { fill: #8b9c7f; opacity: 0.7; }
      .garden-stem { stroke: #9d9c7f; fill: none; stroke-width: 2; }
      .garden-flower { fill: #a88a8a; opacity: 0.6; }
      .garden-center { fill: #9d9c7f; }
    </style>
  </defs>
  
  <!-- Soil/ground -->
  <ellipse cx="200" cy="280" rx="180" ry="40" fill="#9d9c7f" opacity="0.3" />
  
  <!-- Left plant -->
  <path class="garden-stem" d="M 80 280 Q 75 240 80 200" />
  <ellipse class="garden-leaf" cx="70" cy="220" rx="8" ry="15" transform="rotate(-40 70 220)" />
  <ellipse class="garden-leaf" cx="90" cy="210" rx="8" ry="15" transform="rotate(40 90 210)" />
  
  <!-- Left flower -->
  <circle cx="80" cy="190" r="3" class="garden-flower" />
  <circle cx="88" cy="188" r="3" class="garden-flower" />
  <circle cx="90" cy="196" r="3" class="garden-flower" />
  <circle cx="82" cy="200" r="3" class="garden-flower" />
  <circle cx="84" cy="193" r="2" class="garden-center" />
  
  <!-- Center plant (tall) -->
  <path class="garden-stem" d="M 200 280 Q 200 200 200 140" />
  <ellipse class="garden-leaf" cx="185" cy="180" rx="10" ry="20" transform="rotate(-50 185 180)" />
  <ellipse class="garden-leaf" cx="215" cy="170" rx="10" ry="20" transform="rotate(50 215 170)" />
  <ellipse class="garden-leaf" cx="190" cy="140" rx="8" ry="18" transform="rotate(-40 190 140)" />
  <ellipse class="garden-leaf" cx="210" cy="130" rx="8" ry="18" transform="rotate(40 210 130)" />
  
  <!-- Center flower -->
  <circle cx="200" cy="120" r="4" class="garden-flower" />
  <circle cx="210" cy="118" r="4" class="garden-flower" />
  <circle cx="212" cy="128" r="4" class="garden-flower" />
  <circle cx="202" cy="132" r="4" class="garden-flower" />
  <circle cx="190" cy="125" r="4" class="garden-flower" />
  <circle cx="200" cy="124" r="2.5" class="garden-center" />
  
  <!-- Right plant -->
  <path class="garden-stem" d="M 320 280 Q 325 240 320 200" />
  <ellipse class="garden-leaf" cx="330" cy="220" rx="8" ry="15" transform="rotate(40 330 220)" />
  <ellipse class="garden-leaf" cx="310" cy="210" rx="8" ry="15" transform="rotate(-40 310 210)" />
  
  <!-- Right flower -->
  <circle cx="320" cy="190" r="3" class="garden-flower" />
  <circle cx="312" cy="188" r="3" class="garden-flower" />
  <circle cx="310" cy="196" r="3" class="garden-flower" />
  <circle cx="318" cy="200" r="3" class="garden-flower" />
  <circle cx="316" cy="193" r="2" class="garden-center" />
  
  <!-- Small decorative plants -->
  <path class="garden-stem" d="M 120 280 Q 120 260 120 240" />
  <circle cx="120" cy="235" r="2.5" class="garden-flower" />
  <circle cx="126" cy="234" r="2.5" class="garden-flower" />
  <circle cx="128" cy="240" r="2.5" class="garden-flower" />
  
  <path class="garden-stem" d="M 280 280 Q 280 260 280 240" />
  <circle cx="280" cy="235" r="2.5" class="garden-flower" />
  <circle cx="274" cy="234" r="2.5" class="garden-flower" />
  <circle cx="272" cy="240" r="2.5" class="garden-flower" />
</svg>